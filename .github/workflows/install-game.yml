name: Install Captain Belly Rescue game
on:
  push:
    paths:
      - '.deploy/game.tar.gz.b64'
      - '.github/workflows/install-game.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and publish game files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .deploy/game.tar.gz.b64 | tar -xz
          test -s index.html
          test -s game.js
          test -s style.css
          test -s assets/captain.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css game.js favicon.svg README.md assets/captain.jpg .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish playable Captain's Belly Rescue game"
            git push origin HEAD:main
          fi
